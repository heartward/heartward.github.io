<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Heartward</title>
  <meta name="description" content="A free companion for people walking the journey into the Catholic faith: sessions, prayers, guides and answers, all on your phone.">
  <meta name="theme-color" content="#f7f1e6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181f" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <header class="topbar">
    <a href="#/" class="brand" aria-label="Heartward home">
      <img src="icon.svg" alt="" width="28" height="28">
      <span class="brand-text"><span>Heartward</span><small>Your RCIA companion</small></span>
    </a>
    <a id="search-btn" class="icon-btn" href="#/search" aria-label="Search"></a>
  </header>

  <main id="view" tabindex="-1">
    <p class="loading">Lighting the way…</p>
  </main>

  <nav id="tabbar" class="tabbar" aria-label="Main"></nav>

  <script>
    // If the app has not started after a few seconds (for example a broken saved copy), offer a clean reload.
    setTimeout(function () {
      var v = document.getElementById('view');
      if (!v || !v.querySelector('.loading')) return;
      v.innerHTML = '<div class="empty"><h2>Still loading</h2><p>Heartward may have saved an old copy. Tap below to get the newest version. Your progress and journal are kept.</p><button class="btn" id="fixload">Reload Heartward</button></div>';
      document.getElementById('fixload').onclick = function () {
        var jobs = [];
        if (window.caches) jobs.push(caches.keys().then(function (k) { return Promise.all(k.filter(function (n) { return n !== 'heartward-art'; }).map(function (n) { return caches.delete(n); })); }));
        if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (r) { return Promise.all(r.map(function (x) { return x.unregister(); })); }));
        Promise.all(jobs).catch(function () {}).then(function () { location.reload(); });
      };
    }, 6000);
    // When a newer version takes over while the page is still stuck loading, reload into it.
    if (navigator.serviceWorker) navigator.serviceWorker.addEventListener('controllerchange', function () {
      var v = document.getElementById('view');
      if (v && (v.querySelector('.loading') || document.getElementById('fixload'))) location.reload();
    });
  </script>
  <script src="lib/qrcode.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
